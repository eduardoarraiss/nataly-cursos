<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Entrar · Painel de leads</title>
<style>
  /* ============================================================
     A PORTA DO PAINEL — 02/09/2026
     ============================================================
     Esta tela usava a paleta da MARCA (creme, chocolate, sálvia) e o
     painel usa a paleta da FERRAMENTA. Eram duas identidades coladas
     uma na outra: ela entrava numa peça de marca e caía num aplicativo.

     A escolha foi trazer a porta para dentro do aplicativo, e não o
     contrário, por três razões:
       1. o painel é o lugar de TRABALHO, não uma peça que alguém vê —
          e essa decisão já estava tomada, documentada e checada por
          gate (a paleta da marca é proibida no /crm de propósito);
       2. o que a marca comunica é desejo; o que uma ferramenta interna
          precisa comunicar é confiança e clareza — são trabalhos
          diferentes, e a mesma paleta não faz os dois;
       3. a porta e a sala têm de ser o mesmo lugar. Entrar por uma
          identidade e trabalhar em outra é a definição de desalinhado.

     Os tokens abaixo são LITERALMENTE os mesmos do crm.html. Se um
     mudar lá, muda aqui — são dois arquivos, uma identidade só.
     Todo par de cor foi medido; os números estão ao lado.
     ============================================================ */
  :root{
    --fundo:#F6F7F9;
    --carta:#FFFFFF;
    --linha:#E5E8ED;
    --linha-2:#D3D9E0;
    --fio:rgba(16,24,40,.07);
    --ink:#101828;        /* 17.75:1 sobre a carta */
    --ink-2:#54606E;      /*  6.41:1 sobre a carta */
    --ink-3:#667085;      /*  4.97:1 sobre a carta */
    --azul:#2a78d6;
    --azul-txt:#1c5cab;   /*  6.63:1 sobre a carta */
    --azul-esc:#184f95;   /*  8.10:1 sobre a carta */
    --alerta:#B42318;     /*  6.31:1 sobre a carta */
    --f:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --sombra:0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.05);
    --curva:cubic-bezier(.32,.72,0,1);
    --mv:180ms; --mv-r:120ms;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  body{
    min-height:100vh; min-height:100dvh;
    display:grid; place-items:center; padding:24px;
    background:var(--fundo); color:var(--ink);
    font-family:var(--f); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%; font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  .caixa{
    width:100%; max-width:380px; background:var(--carta);
    border:1px solid var(--fio); border-radius:20px;
    padding:32px 28px; box-shadow:var(--sombra);
    animation:surge var(--mv) var(--curva) both;
  }
  @keyframes surge{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

  /* A mesma marca do topo da barra lateral do painel: rótulo pequeno em
     caixa alta, nome logo abaixo. Ela reconhece o lugar antes de digitar. */
  .sub{
    display:block; margin:0 0 4px; font-size:11px; color:var(--ink-3);
    letter-spacing:.08em; text-transform:uppercase; font-weight:640;
  }
  h1{margin:0; font-size:24px; line-height:1.15; font-weight:640; letter-spacing:-.024em}
  .apoio{margin:6px 0 24px; color:var(--ink-2); font-size:14px}

  label{
    display:block; font-size:11px; font-weight:640; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-3); margin-bottom:5px;
  }
  input{
    width:100%; min-height:44px; padding:11px 14px; font:inherit; font-size:16px;
    color:var(--ink); background:var(--carta); border:1px solid var(--linha-2);
    border-radius:10px; margin-bottom:16px;
    transition:border-color var(--mv-r) var(--curva);
  }
  /* 16px no campo é obrigatório: abaixo disso o Safari do iPhone dá zoom
     sozinho ao focar, e a caixa some para fora da tela. */
  input:focus{border-color:var(--azul); outline:2px solid var(--azul-esc); outline-offset:2px}
  button[type="submit"]{
    width:100%; min-height:48px; padding:12px; font:inherit; font-size:16px;
    font-weight:640; letter-spacing:-.008em; color:#FFFFFF;
    background:var(--ink); border:1px solid var(--ink); border-radius:999px; cursor:pointer;
    transition:background var(--mv-r) var(--curva);
  }
  button[type="submit"]:hover{background:#25324a}
  button[type="submit"]:active{transform:translateY(.5px)}
  button[type="submit"][disabled]{opacity:.6;cursor:progress}
  :focus-visible{outline:2px solid var(--azul-esc); outline-offset:2px; border-radius:10px}

  .aviso{
    margin:0 0 16px; padding:11px 13px; border-radius:12px; font-size:14px;
    background:#FEF3F2; border:1px solid #FDA29B; border-left:4px solid var(--alerta);
    color:var(--ink);
  }
  .aviso[hidden]{display:none}
  .rodape{
    margin:20px 0 0; font-size:12.5px; color:var(--ink-3); text-align:center;
    border-top:1px solid var(--linha); padding-top:16px;
  }

  /* Olho para revelar a senha. Existe porque as senhas daqui tem simbolo e
     maiuscula no meio ($ e nAty...), e digitar as cegas no celular erra. */
  .campo-senha{position:relative}
  .campo-senha input{padding-right:48px}
  .olho{
    position:absolute; right:4px; top:22px; transform:translateY(-50%);
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:0; cursor:pointer; color:var(--ink-3); border-radius:8px;
  }
  .olho:hover{color:var(--ink)}
  .olho:focus-visible{outline:2px solid var(--azul-esc); outline-offset:2px}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
  <main class="caixa">
    <span class="sub">Nataly Ribeiro</span>
    <h1>Painel de leads</h1>
    <p class="apoio">Curso presencial · Cambuí, MG</p>

    <p class="aviso" id="aviso" role="alert" aria-live="assertive" hidden></p>

    <form id="form" novalidate>
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" required>

      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="button" id="olho" class="olho" aria-label="Mostrar senha" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path id="olho-forma" d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/>
            <circle cx="12" cy="12" r="3.2"/>
            <line id="olho-corte" x1="3.5" y1="20.5" x2="20.5" y2="3.5" style="display:none"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="botao">Entrar</button>
    </form>

    <p class="rodape">Esta página trata dados pessoais de terceiros.<br>Não compartilhe o acesso.</p>
  </main>

<script>
(function () {
  var form = document.getElementById('form');
  var aviso = document.getElementById('aviso');
  var botao = document.getElementById('botao');

  document.getElementById('usuario').focus();

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    aviso.hidden = true;
    botao.disabled = true;
    botao.textContent = 'Entrando...';

    fetch('/crm/entrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      /* .trim() nos dois: espaco colado sem querer no inicio ou no fim e a
         causa mais comum de "senha incorreta" com a senha certa — e o teclado
         do celular acrescenta espaco depois de colar. Aparar aqui, no envio,
         e nao enquanto digita, para nao atrapalhar quem esta escrevendo. */
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value.trim(),
        senha: document.getElementById('senha').value.trim()
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok) { window.location.replace('/crm'); return; }
        aviso.textContent = res.j.mensagem || 'Não consegui entrar.';
        aviso.hidden = false;
        botao.disabled = false;
        botao.textContent = 'Entrar';
        document.getElementById('senha').value = '';
        document.getElementById('senha').focus();
      })
      .catch(function () {
        aviso.textContent = 'Sem conexão com o servidor. Tente de novo.';
        aviso.hidden = false;
        botao.disabled = false;
        botao.textContent = 'Entrar';
      });
  });
})();
</script>

<script>
  /* Revela a senha. Devolve o foco ao campo e mantem o cursor no fim, senao
     quem clica no olho no meio da digitacao perde a posicao. */
  (function () {
    var b = document.getElementById('olho');
    var c = document.getElementById('senha');
    var corte = document.getElementById('olho-corte');
    if (!b || !c) return;
    b.addEventListener('click', function () {
      var mostrando = c.type === 'text';
      c.type = mostrando ? 'password' : 'text';
      b.setAttribute('aria-pressed', String(!mostrando));
      b.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      if (corte) corte.style.display = mostrando ? 'none' : '';
      var fim = c.value.length;
      c.focus();
      try { c.setSelectionRange(fim, fim); } catch (e) {}
    });
  })();
</script>
</body>
</html>
