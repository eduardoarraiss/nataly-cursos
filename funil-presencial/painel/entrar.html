<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Entrar · Painel de leads</title>
<style>
  :root{
    --creme:#F2EEE5; --papel:#FAF7F0; --tinta:#463729; --tinta-2:#7A695A;
    --filete:#DED3C2; --chocolate:#6B4F3A; --destaque:#CD4C28; --erro:#A93C1E;
    --f:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--creme);color:var(--tinta);font-family:var(--f);font-size:17px;line-height:1.6}
  .caixa{width:100%;max-width:380px;background:var(--papel);border:1px solid var(--filete);
         border-radius:20px;padding:32px}
  h1{margin:0 0 4px;font-size:26px;line-height:1.2}
  .sub{margin:0 0 24px;color:var(--tinta-2);font-size:15px}
  label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:13px 14px;font:inherit;font-size:16px;color:var(--tinta);
        background:#fff;border:1px solid var(--filete);border-radius:12px;margin-bottom:16px}
  input:focus{outline:3px solid rgba(205,76,40,.35);outline-offset:1px;border-color:var(--chocolate)}
  button{width:100%;padding:14px;font:inherit;font-size:17px;font-weight:700;color:#fff;
         background:var(--chocolate);border:0;border-radius:999px;cursor:pointer}
  button:hover{background:#5a4230}
  button[disabled]{opacity:.6;cursor:progress}
  .aviso{margin:0 0 16px;padding:11px 13px;border-radius:12px;font-size:15px;
         background:#F7E4DE;border:1px solid var(--erro);color:#7E2C13}
  .aviso[hidden]{display:none}
  .rodape{margin:20px 0 0;font-size:13px;color:var(--tinta-2);text-align:center}

  /* Olho para revelar a senha. Existe porque as senhas daqui tem simbolo e
     maiuscula no meio ($ e nAty...), e digitar as cegas no celular erra. */
  .campo-senha{position:relative}
  .campo-senha input{padding-right:48px}
  .olho{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:0; cursor:pointer; color:#7A695A; border-radius:8px;
  }
  .olho:hover{color:var(--tinta)}
  .olho:focus-visible{outline:3px solid rgba(205,76,40,.35); outline-offset:1px}
</style>
</head>
<body>
  <main class="caixa">
    <h1>Painel de leads</h1>
    <p class="sub">Curso presencial · Cambuí, MG</p>

    <p class="aviso" id="aviso" role="alert" aria-live="assertive" hidden></p>

    <form id="form" novalidate>
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" required>

      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="button" id="olho" class="olho" aria-label="Mostrar senha" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path id="olho-forma" d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/>
            <circle cx="12" cy="12" r="3.2"/>
            <line id="olho-corte" x1="3.5" y1="20.5" x2="20.5" y2="3.5" style="display:none"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="botao">Entrar</button>
    </form>

    <p class="rodape">Esta página trata dados pessoais de terceiros.<br>Não compartilhe o acesso.</p>
  </main>

<script>
(function () {
  var form = document.getElementById('form');
  var aviso = document.getElementById('aviso');
  var botao = document.getElementById('botao');

  document.getElementById('usuario').focus();

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    aviso.hidden = true;
    botao.disabled = true;
    botao.textContent = 'Entrando...';

    fetch('/crm/entrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      /* .trim() nos dois: espaco colado sem querer no inicio ou no fim e a
         causa mais comum de "senha incorreta" com a senha certa — e o teclado
         do celular acrescenta espaco depois de colar. Aparar aqui, no envio,
         e nao enquanto digita, para nao atrapalhar quem esta escrevendo. */
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value.trim(),
        senha: document.getElementById('senha').value.trim()
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok) { window.location.replace('/crm'); return; }
        aviso.textContent = res.j.mensagem || 'Não consegui entrar.';
        aviso.hidden = false;
        botao.disabled = false;
        botao.textContent = 'Entrar';
        document.getElementById('senha').value = '';
        document.getElementById('senha').focus();
      })
      .catch(function () {
        aviso.textContent = 'Sem conexão com o servidor. Tente de novo.';
        aviso.hidden = false;
        botao.disabled = false;
        botao.textContent = 'Entrar';
      });
  });
})();
</script>

<script>
  /* Revela a senha. Devolve o foco ao campo e mantem o cursor no fim, senao
     quem clica no olho no meio da digitacao perde a posicao. */
  (function () {
    var b = document.getElementById('olho');
    var c = document.getElementById('senha');
    var corte = document.getElementById('olho-corte');
    if (!b || !c) return;
    b.addEventListener('click', function () {
      var mostrando = c.type === 'text';
      c.type = mostrando ? 'password' : 'text';
      b.setAttribute('aria-pressed', String(!mostrando));
      b.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      if (corte) corte.style.display = mostrando ? 'none' : '';
      var fim = c.value.length;
      c.focus();
      try { c.setSelectionRange(fim, fim); } catch (e) {}
    });
  })();
</script>
</body>
</html>
