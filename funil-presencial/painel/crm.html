      ['Por que foi indicado', texto(lead.recomendacao_motivos)]
    ]));
    painel.appendChild(bProd);
    }

    var bOrigem = bloco('Origem do lead');
    bOrigem.appendChild(listaDados([
      ['utm_source', texto(lead.utm_source)],
      ['utm_medium', texto(lead.utm_medium)],
      ['utm_campaign', texto(lead.utm_campaign)],
      ['utm_content', texto(lead.utm_content)],
      ['utm_term', texto(lead.utm_term)],
      ['fbclid', texto(lead.fbclid)],
      ['gclid', texto(lead.gclid)],
      ['Referência', texto(lead.referrer)],
      ['Página', texto(lead.pagina)],
      ['IP', texto(lead.ip)],
      ['Navegador', texto(lead.user_agent)]
    ]));
    painel.appendChild(bOrigem);

    var bStatus = bloco('Mudar o status');
    var botoes = el('div', 'status-botoes');
    var area = document.createElement('textarea');
    area.id = 'anotacaoNova';
    area.setAttribute('placeholder', 'Anotação sobre essa mudança (opcional)');

    var recado = el('p', 'aviso-erro-form');
    recado.setAttribute('role', 'status');
    recado.setAttribute('aria-live', 'polite');

    STATUS.forEach(function (s) {
      var atual = lead.status === s;
      var b = el('button', 'bt bt-peq' + (atual ? ' bt-forte' : ''), rot('status', s));
      b.type = 'button';
      if (atual) {
        b.setAttribute('aria-disabled', 'true');
        b.setAttribute('aria-current', 'true');
        b.disabled = true;
      } else {
        b.addEventListener('click', function () {
          var todos = botoes.querySelectorAll('button');
          for (var i = 0; i < todos.length; i++) todos[i].disabled = true;
          b.textContent = 'Salvando...';
          recado.textContent = 'Salvando a mudança de status...';
          salvaStatus(lead.id, s, area.value, function (erro) {
            if (erro) {
              for (var j = 0; j < todos.length; j++) todos[j].disabled = false;
              b.textContent = rot('status', s);
              recado.textContent = 'Não consegui salvar. Verifique a conexão e tente de novo.';
            }
          });
        });
      }
      botoes.appendChild(b);
    });

    var lbl = el('label', 'rot-campo', 'Anotação');
    lbl.setAttribute('for', 'anotacaoNova');
    poe(bStatus, botoes, lbl, area, recado);
    painel.appendChild(bStatus);

    var bHist = bloco('Histórico');
    if (!historico.length) {
      bHist.appendChild(el('p', 'kvazio', 'Sem mudanças de status até agora.'));
    } else {
      var ul = el('ul', 'tempo');
      historico.forEach(function (h) {
        var li = document.createElement('li');
        li.appendChild(el('strong', null,
          'de ' + rot('status', h.de_status) + ' para ' + rot('status', h.para_status)));
        var quando = el('span', 'quando',
          dataRelativa(h.criado_em) + (h.autor ? ' · ' + texto(h.autor) : ''));
        quando.setAttribute('title', dataAbsoluta(h.criado_em));
        li.appendChild(quando);
        if (h.anotacao) li.appendChild(el('span', 'nota', texto(h.anotacao)));
        ul.appendChild(li);
      });
      bHist.appendChild(ul);
    }
    painel.appendChild(bHist);

    var bAvisos = bloco('Aviso no WhatsApp');
    if (!avisos.length) {
      bAvisos.appendChild(el('p', 'kvazio', 'Nenhum aviso registrado para esse lead.'));
    } else {
      var ulA = el('ul', 'linhas');
      avisos.forEach(function (a) {
        var li = el('li', 'aviso-item');
        li.appendChild(el('strong', null, rot('aviso', a.status)));
        var meta = el('p', 'td-sub',
          (a.tentativas || 0) + (Number(a.tentativas) === 1 ? ' tentativa' : ' tentativas') +
          ' · criado ' + dataRelativa(a.criado_em) +
          (a.enviado_em ? ' · enviado ' + dataRelativa(a.enviado_em) : ''));
        meta.setAttribute('title', dataAbsoluta(a.criado_em));
        li.appendChild(meta);
        if (a.destino) li.appendChild(el('p', 'td-sub', 'Destino: ' + texto(a.destino)));
        if (a.ultimo_erro) li.appendChild(el('p', 'erro-txt', 'Último erro: ' + texto(a.ultimo_erro)));
        if (a.status !== 'enviado') {
          var b2 = el('button', 'bt bt-peq bt-forte', 'Reenviar aviso');
          b2.type = 'button';
          b2.addEventListener('click', function () { reenviaAviso(a.id, b2, li); });
          li.appendChild(b2);
        }
        ulA.appendChild(li);
      });
      bAvisos.appendChild(ulA);
    }
    painel.appendChild(bAvisos);

    painel.scrollTop = 0;
    var foco = painel.querySelector('.painel-topo button');
    if (foco) foco.focus();
  }

  function salvaStatus(id, status, anotacao, aoTerminar) {
    return api('/crm/api/lead/' + encodeURIComponent(id) + '/status', {
      method: 'POST',
      body: JSON.stringify({ status: status, anotacao: anotacao || '' })
    }).then(function () {
      if (aoTerminar) aoTerminar(null);
      return Promise.all([carregaLeads(), carregaResumo()]).then(function () {
        if (painelAberto) return api('/crm/api/lead/' + encodeURIComponent(id)).then(desenhaDetalhe);
      });
    }).catch(function (e) {
      if (e.message === 'sessao') return;
      if (aoTerminar) aoTerminar(e);
      else anuncia('Não consegui salvar a mudança de status.');
    });
  }

  /* ---------- abrir, fechar, prender o foco ---------- */
  function mostraPainel() {
    painel.classList.remove('oculto');
    fundo.classList.remove('oculto');
    document.body.style.overflow = 'hidden';
    painelAberto = true;
  }
  function fechaPainel() {
    if (!painelAberto) return;
    painelAberto = false;
    painel.classList.add('oculto');
    fundo.classList.add('oculto');
    document.body.style.overflow = '';
    limpa(painel);
    try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) { /* ok */ }
    if (estado.abridor && document.contains(estado.abridor)) estado.abridor.focus();
    else document.getElementById('abaLista').focus();
    estado.abridor = null;
  }
  fundo.addEventListener('click', fechaPainel);

  document.addEventListener('keydown', function (ev) {
    if (!painelAberto) return;
    if (ev.key === 'Escape' || ev.key === 'Esc') { ev.preventDefault(); fechaPainel(); return; }
    if (ev.key !== 'Tab') return;
    var focaveis = painel.querySelectorAll(
      'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])');
    if (!focaveis.length) { ev.preventDefault(); painel.focus(); return; }
    var primeiro = focaveis[0], ultimo = focaveis[focaveis.length - 1];
    if (ev.shiftKey && (document.activeElement === primeiro || document.activeElement === painel)) {
      ev.preventDefault(); ultimo.focus();
    } else if (!ev.shiftKey && document.activeElement === ultimo) {
      ev.preventDefault(); primeiro.focus();
    }
  });

  /* ============================================================
     NAVEGAÇÃO — quatro seções, um <nav> só
     ============================================================
     A página única virou quatro vistas. Cada uma responde a uma
     pergunta diferente e por isso não deviam dividir a mesma tela:

       Painel   — "como estão as coisas?"    (números e gráficos)
       Pipeline — "o que eu faço agora?"     (o kanban de sempre)
       Leads    — "cadê a fulana?"           (a lista, busca e filtros)
       Avisos   — "algum WhatsApp não saiu?"

     Continua sendo um `tablist` com as setas do teclado: mudou a
     posição na tela, não a semântica.
     ============================================================ */
  var ABAS = [
    { id: 'painel', botao: 'abaPainel', painel: pPainel, titulo: 'Painel' },
    { id: 'kanban', botao: 'abaKanban', painel: pKanban, titulo: 'Pipeline' },
    { id: 'lista',  botao: 'abaLista',  painel: pLista,  titulo: 'Leads' },
    { id: 'avisos', botao: 'abaAvisos', painel: pAvisos, titulo: 'Avisos' }
  ];

  /* Os filtros só aparecem onde recortam alguma coisa. No Painel e nos
     Avisos eles não somem do ESTADO — somem da tela; o Painel avisa,
     em texto, quando está mostrando um recorte. */
  var COM_FILTRO = { lista: true, kanban: true };

  /* A última vista fica guardada no aparelho dela. Ela abre isto dez
     vezes por dia: cair sempre no Painel obrigaria um toque a mais em
     toda sessão de quem só quer trabalhar a lista. Na primeira visita
     abre no Painel, que é a visão geral. */
  var CHAVE_VISTA = 'crm.vista';
  function vistaGuardada() {
    try {
      var v = window.localStorage.getItem(CHAVE_VISTA);
      for (var i = 0; i < ABAS.length; i++) if (ABAS[i].id === v) return v;
    } catch (e) { /* modo privado, armazenamento bloqueado: segue no padrão */ }
    return 'painel';
  }
  function guardaVista(v) {
    try { window.localStorage.setItem(CHAVE_VISTA, v); } catch (e) {}
  }

  function trocaAba(qual, foca) {
    estado.aba = qual;
    guardaVista(qual);
    var titulo = 'Painel';
    ABAS.forEach(function (a) {
      var b = document.getElementById(a.botao);
      var ativa = a.id === qual;
      b.setAttribute('aria-selected', ativa ? 'true' : 'false');
      b.setAttribute('tabindex', ativa ? '0' : '-1');
      a.painel.hidden = !ativa;
      /* A vista entra com um movimento curto (180ms, só opacidade e 6px
         de subida). Reiniciar a animação exige tirar e repor a classe —
         sem isso o navegador não reconhece que ela deve rodar de novo. */
      if (ativa) {
        a.painel.classList.remove('vista');
        void a.painel.offsetWidth;
        a.painel.classList.add('vista');
        titulo = a.titulo;
      }
      if (ativa && foca) b.focus();
    });
    var t = document.getElementById('tituloVista');
    if (t) t.textContent = titulo;
    document.title = titulo + ' · Leads · Nataly Ribeiro';
    var f = document.getElementById('filtros');
    if (f) f.classList.toggle('oculto', !COM_FILTRO[qual]);
    desenhaConteudo();
    if (qual === 'avisos') carregaAvisos();
  }

  ABAS.forEach(function (a, i) {
    var b = document.getElementById(a.botao);
    b.addEventListener('click', function () { trocaAba(a.id, false); });
    b.addEventListener('keydown', function (ev) {
      /* A lista é vertical no desktop e horizontal no celular: as quatro
         setas andam nela, senão a direção certa depende da largura da
         tela — e ninguém adivinha isso. */
      var k = ev.key;
      var passo = (k === 'ArrowRight' || k === 'ArrowDown') ? 1
                : ((k === 'ArrowLeft' || k === 'ArrowUp') ? -1 : 0);
      if (!passo) return;
      ev.preventDefault();
      trocaAba(ABAS[(i + passo + ABAS.length) % ABAS.length].id, true);
    });
  });

  function desenhaConteudo() {
    _redraw = null;
    if (estado.aba === 'lista') desenhaLista();
    else if (estado.aba === 'kanban') desenhaKanban();
    else if (estado.aba === 'painel') desenhaPainel();
    else desenhaAvisos();
  }

  /* ============================================================
     Filtros
     ============================================================ */
  var relogio = null;
  function agenda(fn, ms) {
    if (relogio) window.clearTimeout(relogio);
    relogio = window.setTimeout(fn, ms);
  }

  function leFiltros() {
    estado.filtros.busca = document.getElementById('fBusca').value.trim();
    estado.filtros.status = document.getElementById('fStatus').value;
    estado.filtros.qualificacao = document.getElementById('fQualif').value;
    estado.filtros.produto_id = document.getElementById('fProduto').value;
    estado.filtros.cidade = document.getElementById('fCidade').value.trim();
    estado.filtros.utm_content = document.getElementById('fAnuncio').value;
    estado.periodo = document.getElementById('fPeriodo').value;
    estado.completo = document.getElementById('fCompleto').value || 'sim';
    atualizaLinkCsv();
  }

  function aplicaFiltros(comAtraso) {
    leFiltros();
    if (comAtraso) agenda(carregaLeads, 300);
    else { if (relogio) window.clearTimeout(relogio); carregaLeads(); }
  }

  /* O período é o único filtro que NÃO vai ao servidor — recortar a lista
     que já está na memória é instantâneo e evita uma ida à rede. */
  function aplicaPeriodo() {
    leFiltros();
    desenhaKpis();
    desenhaContadoresAba();
    desenhaConteudo();
    anuncia(visiveis().length + ' leads no período escolhido.');
  }

  document.getElementById('fBusca').addEventListener('input', function () { aplicaFiltros(true); });
  document.getElementById('fCidade').addEventListener('input', function () { aplicaFiltros(true); });
  ['fStatus', 'fQualif', 'fProduto', 'fAnuncio', 'fCompleto'].forEach(function (id) {
    /* ⚠️ `fProduto` estava FORA desta lista: o filtro de produto existia na
       tela, entrava no estado e ia no CSV, mas nunca recarregava a lista.
       Escolher um produto não fazia nada. Corrigido em 01/09/2026. */
    document.getElementById(id).addEventListener('change', function () { aplicaFiltros(false); });
  });
  document.getElementById('fPeriodo').addEventListener('change', aplicaPeriodo);
  document.getElementById('filtros').addEventListener('submit', function (ev) {
    ev.preventDefault();
    aplicaFiltros(false);
  });

  document.getElementById('btLimpar').addEventListener('click', function () {
    /* limpa TODOS, inclusive produto e período — deixar um de fora faz a
       tela mentir sobre estar sem filtro */
    estado.filtros = { busca: '', status: '', qualificacao: '', produto_id: '', cidade: '', utm_content: '' };
    estado.periodo = '';
    /* Volta ao PADRÃO ('sim'), não ao vazio: "sem filtro" aqui significa a
       lista de inscrições completas, que é o que o painel sempre mostrou.
       Zerar para '' mandaria uma query sem o parâmetro e a tela passaria a
       depender do padrão do servidor — dois lugares decidindo a mesma coisa. */
    estado.completo = 'sim';
    escreveFiltros();
    carregaLeads();
    anuncia('Filtros limpos.');
  });

  /* ============================================================
     Sair
     ============================================================ */
  ['btSair', 'btSairLado'].forEach(function (id) {
    var b = document.getElementById(id);
    if (!b) return;
    b.addEventListener('click', function () {
      api('/crm/sair', { method: 'POST' }).then(paraLogin).catch(paraLogin);
    });
  });

  /* ============================================================
     Redesenho dos gráficos quando a largura muda
     ============================================================ */
  var timerResize = null;
  window.addEventListener('resize', function () {
    if (!_redraw) return;
    if (timerResize) window.clearTimeout(timerResize);
    timerResize = window.setTimeout(function () { if (_redraw) _redraw(); }, 150);
  });

  /* ============================================================
     Início
     ============================================================ */
  ajustaFiltros();
  preencheSelects();
  atualizaLinkCsv();
  desenhaKpis();
  desenhaContadoresAba();
  /* A vista é escolhida ANTES do primeiro fetch: assim a tela já nasce na
     seção certa, com o título certo e os filtros no estado certo — em vez
     de aparecer no Painel e pular para outra seção meio segundo depois. */
  trocaAba(vistaGuardada(), false);
  carregaResumo();
  carregaLeads().then(function () {
    var m = /(?:^|#|&)lead=(\d+)/.exec(window.location.hash || '');
    if (m) abreLead(parseInt(m[1], 10), null);
  });

  /* Recarrega o resumo de tempos em tempos para o contador não envelhecer. */
  window.setInterval(carregaResumo, 120000);
})();
</script>
</body>
</html>
